name: Build CBC Sport Broadcast (Android)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Use fixed signing key (updates install over old version)
        run: mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore
      - run: npm install
      - run: npm run android:init
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../CBC-Sport-Broadcast.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CBC-Sport-Broadcast-android
          path: CBC-Sport-Broadcast.apk
      - name: Publish to Releases (direct download link, no login needed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./package.json').version")
          gh release delete "v$V" -y --cleanup-tag 2>/dev/null || true
          gh release create "v$V" CBC-Sport-Broadcast.apk --title "CBC Sport Broadcast v$V" --notes "Android APK — telefona yükləyin və köhnənin üstünə quraşdırın." --latest
